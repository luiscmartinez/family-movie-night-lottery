# Cloudflare Worker configuration. Everything here fits the Workers Free plan.
# Deployed automatically by Workers Builds on every push to the production branch.
#
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "family-movie-night-lottery"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Variables are set in the dashboard (Settings -> Variables and Secrets), not
# here, so the family's names stay out of this public repository. This flag
# stops deploys from wiping them.
#   FAMILY_MEMBERS  (text)    exactly 9 comma-separated names
#   ADMIN_PASSWORD  (secret)  at least 12 characters
keep_vars = true

# One SQLite-backed Durable Object holds all lottery state (free plan supports SQLite DOs).
[[durable_objects.bindings]]
name = "LOTTERY"
class_name = "LotteryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LotteryDO"]

[observability]
enabled = true
